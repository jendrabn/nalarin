name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /var/www/nalarin
            git fetch --depth 1 origin ${{ github.sha }}
            git reset --hard FETCH_HEAD
            npm ci
            npm exec drizzle-kit migrate
            npm run build
            if pm2 describe nalarin >/dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --update-env
            else
              pm2 start ecosystem.config.cjs --env production
            fi

            APP_PORT=$(node -e "const config = require('./ecosystem.config.cjs'); console.log(config.apps[0].env.APP_PORT || 3001)")
            for attempt in $(seq 1 12); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}" >/dev/null; then
                echo "Health check passed."
                pm2 save
                exit 0
              fi

              sleep 5
            done

            echo "Health check failed."
            exit 1
