name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DEPLOY_BRANCH: main
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/nalarin' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            bash -s -- "$DEPLOY_PATH" "$DEPLOY_BRANCH" <<'REMOTE'
          set -euo pipefail

          DEPLOY_PATH="$1"
          DEPLOY_BRANCH="$2"

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "Deploy path $DEPLOY_PATH belum berisi repository git. Lakukan first deploy manual lebih dulu."
            exit 1
          fi

          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            echo "File $DEPLOY_PATH/.env belum ada. Workflow tidak membuat atau mengisi .env secara otomatis."
            exit 1
          fi

          export BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
          export PATH="$BUN_INSTALL/bin:$PATH"

          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
            export PATH="$HOME/.bun/bin:$PATH"
          fi

          if ! command -v pm2 >/dev/null 2>&1; then
            bun add -g pm2
          fi

          cd "$DEPLOY_PATH"

          git fetch origin "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"

          read_env() {
            local key="$1"
            (grep -E "^${key}=" .env || true) | tail -n 1 | cut -d '=' -f 2- | sed -e 's/\r$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          }

          NODE_ENV_VALUE="$(read_env NODE_ENV)"
          APP_URL_VALUE="$(read_env APP_URL)"
          NEXT_PUBLIC_APP_URL_VALUE="$(read_env NEXT_PUBLIC_APP_URL)"
          FILE_STORAGE_PUBLIC_DIR_VALUE="$(read_env FILE_STORAGE_PUBLIC_DIR)"
          FILE_STORAGE_PUBLIC_DIR_VALUE="${FILE_STORAGE_PUBLIC_DIR_VALUE:-public/uploads}"

          if [ "$NODE_ENV_VALUE" = "production" ]; then
            if [ -z "$APP_URL_VALUE" ] || [ -z "$NEXT_PUBLIC_APP_URL_VALUE" ]; then
              echo "APP_URL dan NEXT_PUBLIC_APP_URL wajib diisi di production."
              exit 1
            fi

            if printf '%s\n%s\n' "$APP_URL_VALUE" "$NEXT_PUBLIC_APP_URL_VALUE" | grep -Eq 'localhost|127\.0\.0\.1'; then
              echo "APP_URL dan NEXT_PUBLIC_APP_URL production tidak boleh memakai localhost."
              exit 1
            fi

            if [ "$APP_URL_VALUE" != "$NEXT_PUBLIC_APP_URL_VALUE" ]; then
              echo "APP_URL dan NEXT_PUBLIC_APP_URL harus sama di production."
              exit 1
            fi
          fi

          mkdir -p \
            "$FILE_STORAGE_PUBLIC_DIR_VALUE" \
            "$FILE_STORAGE_PUBLIC_DIR_VALUE/avatars" \
            "$FILE_STORAGE_PUBLIC_DIR_VALUE/blog" \
            "$FILE_STORAGE_PUBLIC_DIR_VALUE/questions" \
            "$FILE_STORAGE_PUBLIC_DIR_VALUE/taxonomy"
          chmod -R ug+rwX "$FILE_STORAGE_PUBLIC_DIR_VALUE"

          bun install
          bun run build

          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          pm2 status nalarin

          if [ "$NODE_ENV_VALUE" = "production" ]; then
            LOGOUT_HEADERS="$(curl -k --max-time 20 -sSI "$APP_URL_VALUE/logout" || true)"

            if printf '%s\n' "$LOGOUT_HEADERS" | grep -Eiq 'set-cookie: .*Max-Age=0'; then
              echo "Smoke test gagal: GET /logout masih menghapus session cookie."
              exit 1
            fi

            if printf '%s\n' "$LOGOUT_HEADERS" | grep -Eiq 'location: https?://(localhost|127\.0\.0\.1)'; then
              echo "Smoke test gagal: redirect production masih mengarah ke localhost."
              exit 1
            fi

            AVATAR_SMOKE_HEADERS="$(curl -k --max-time 20 -sSI "$APP_URL_VALUE/uploads/avatars/__nalarin-smoke-test__.png" || true)"

            if ! printf '%s\n' "$AVATAR_SMOKE_HEADERS" | grep -Eq '^HTTP/.* 404'; then
              echo "Smoke test gagal: /uploads/avatars tidak dilayani oleh Nginx/public uploads."
              exit 1
            fi
          fi
          REMOTE
