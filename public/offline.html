<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0053c6" />
    <title>Nalarin sedang offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
      }

      main {
        width: min(100% - 32px, 440px);
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        padding: 28px;
        background: #ffffff;
        box-shadow: 0 18px 44px rgb(15 23 42 / 0.08);
      }

      img {
        width: 52px;
        height: 52px;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 1.35rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192x192.png" alt="" />
      <h1>Koneksi terputus</h1>
      <p>
        Nalarin belum bisa memuat halaman ini. Periksa koneksi internet lalu
        muat ulang halaman.
      </p>
    </main>
  </body>
</html>
